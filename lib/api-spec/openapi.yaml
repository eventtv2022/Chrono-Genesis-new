              enum: [yes, no, null]
            ballots:
              type: array
              items:
                type: object
                properties:
                  voterName:
                    type: string
                  vote:
                    type: string
                    enum: [yes, no]
                required: [voterName, vote]
          required: [myVote, ballots]

