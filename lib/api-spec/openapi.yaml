          enum: [scheduled, active, completed, cancelled]
        createdAt:
          type: string
          format: date-time
        yesCount:
          type: integer
        noCount:
          type: integer
      required: [id, title, description, eligibleRoles, createdBy, startsAt, endsAt, status, createdAt, yesCount, noCount]
