openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TimeNation API — digital state where time is currency
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: citizens
    description: Citizen management
  - name: sessions
    description: TiMETR timer sessions
  - name: transactions
    description: Time transfer transactions
  - name: timeline
    description: Timeline anchor operations
  - name: payments
    description: Fiat gateway — buy minutes
  - name: timenaming
    description: Historical minute licenses and NFT minting
paths:
  /timenaming/config:
    get:
      operationId: getTimenamingConfig
      tags: [timenaming]
      summary: Get public Timenaming network and mint configuration
      responses:
        "200":
          description: Public network, royalty, contract, and storage status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimenamingConfig"

  /timenaming/check/{timestamp}:
    get:
      operationId: checkTimenamingMinute
      tags: [timenaming]
      summary: Check historical minute availability
      parameters:
        - name: timestamp
          in: path
          required: true
          schema:
            type: string
            pattern: "^\\d{12}$"
      responses:
        "200":
          description: Availability and existing license summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimenamingAvailability"
        "400":
          description: Invalid minute coordinate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /timenaming/mine:
    get:
      operationId: listMyTimenamingLicenses
      tags: [timenaming]
      summary: List the authenticated citizen's minute licenses
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Citizen's licenses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimenamingLicenseList"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /timenaming/reserve:
    post:
      operationId: reserveTimenamingMinute
      tags: [timenaming]
      summary: Reserve a historical minute or purchase its NFT package
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimenamingReservationInput"
      responses:
        "201":
          description: Minute reserved or all-inclusive NFT purchase completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimenamingMutationResult"
        "402":
          description: Insufficient transferable balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Minute already reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /timenaming/upgrade:
    post:
      operationId: upgradeTimenamingMinute
      tags: [timenaming]
      summary: Upgrade the citizen's reserved minute to an NFT license
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimenamingUpgradeInput"
      responses:
        "200":
          description: License created and NFT mint started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimenamingMutationResult"
        "402":
          description: Insufficient transferable balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Minute already minted or mint pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /timenaming/{certificateId}/generate-certificate:
    post:
      operationId: generateTimenamingCertificate
      tags: [timenaming]
      summary: Generate the citizen's PDF license certificate
      security:
        - BearerAuth: []
      parameters:
        - name: certificateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Certificate download path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimenamingCertificateResult"
        "404":
          description: License not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /timenaming/{certificateId}/certificate:
    get:
      operationId: downloadTimenamingCertificate
      tags: [timenaming]
      summary: Download the authenticated citizen's PDF license certificate
      security:
        - BearerAuth: []
      parameters:
        - name: certificateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF certificate
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Certificate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /timenaming/{certificateId}/mint-nft:
    post:
      operationId: mintTimenamingNft
      tags: [timenaming]
      summary: Mint an NFT for the citizen's minute license
      security:
        - BearerAuth: []
      parameters:
        - name: certificateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mint submitted or confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimenamingMutationResult"
        "409":
          description: Mint already confirmed or pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /service-catalog/preview:
    post:
      operationId: previewServiceCatalogListing
      tags: [citizens]
      summary: Audit a service listing before publication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCatalogAuditPreviewInput"
      responses:
        "200":
          description: Price recommendation and short-lived signed audit token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCatalogAuditPreview"
        "400":
          description: Invalid listing details or required AI consent/documents are missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /service-catalog:
    post:
      operationId: publishServiceCatalogListing
      tags: [citizens]
      summary: Audit and publish a citizen service listing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCatalogPublishInput"
      responses:
        "201":
          description: Listing published and the fixed publication fee charged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCatalogPublishResult"
        "400":
          description: Invalid listing details or required AI consent/documents are missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient balance for the publication fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginCitizen
      tags: [citizens]
      summary: Log in with a phone number and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated citizen profile and bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Login failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/complete-age:
    post:
      operationId: completeCitizenAgeProfile
      tags: [citizens]
      summary: Complete a logged-in citizen's missing age profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteAgeProfileInput"
      responses:
        "200":
          description: Age tier derived and saved; date of birth is not returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteAgeProfileResult"
        "400":
          description: Invalid date of birth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The citizen is under 13
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The age profile has already been completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: registerCitizenWithPassword
      tags: [citizens]
      summary: Register a citizen after completing the pre-application guide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordCitizenRegistrationInput"
      responses:
        "201":
          description: Registered citizen with pending passport eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenRegistrationResult"
        "409":
          description: Phone already registered or guide progress is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/telegram-webapp:
    post:
      operationId: authenticateTelegramWebApp
      tags: [citizens]
      summary: Authenticate or register a Telegram Mini App citizen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramWebAppInput"
      responses:
        "200":
          description: Existing Telegram citizen session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramWebAppSession"
        "201":
          description: Newly registered Telegram citizen session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramWebAppSession"

  /onboarding/status:
    get:
      operationId: getOnboardingStatus
      tags: [citizens]
      summary: Get the authenticated citizen's tutorial status
      responses:
        "200":
          description: Tutorial status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /onboarding/start:
    post:
      operationId: startOnboarding
      tags: [citizens]
      summary: Start the authenticated citizen's 60-minute tutorial
      responses:
        "200":
          description: Tutorial status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [citizens]
      summary: Complete the tutorial after its server-verified duration
      responses:
        "200":
          description: Tutorial status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "409":
          description: Tutorial is not complete yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /onboarding/progress/sessions:
    post:
      operationId: createOnboardingProgressSession
      tags: [citizens]
      summary: Create an anonymous onboarding progress session
      responses:
        "201":
          description: New progress session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgressSession"
  /onboarding/progress/sessions/{progressToken}:
    parameters:
      - name: progressToken
        in: path
        required: true
        schema:
          type: string
          minLength: 64
          maxLength: 64
    get:
      operationId: getOnboardingProgressSession
      tags: [citizens]
      summary: Get anonymous onboarding progress
      responses:
        "200":
          description: Onboarding progress session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgressSession"
        "404":
          description: Progress session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOnboardingProgressSession
      tags: [citizens]
      summary: Reveal or advance a pre-application question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingProgressActionInput"
      responses:
        "200":
          description: Updated onboarding progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgressSession"
        "409":
          description: Question order or stage is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /onboarding/progress:
    get:
      operationId: getCitizenOnboardingProgress
      tags: [citizens]
      summary: Get the authenticated citizen's simulator progress
      responses:
        "200":
          description: Onboarding progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgress"
    patch:
      operationId: updateCitizenOnboardingProgress
      tags: [citizens]
      summary: Reveal or advance a passport simulator question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingProgressActionInput"
      responses:
        "200":
          description: Updated onboarding progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgress"
        "409":
          description: Question order or stage is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /citizens:
    get:
      operationId: listCitizens
      tags: [citizens]
      summary: List all citizens
      responses:
        "200":
          description: List of citizens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Citizen"
    post:
      operationId: createCitizen
      tags: [citizens]
      summary: Register a new citizen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenInput"
      responses:
        "201":
          description: Created citizen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Citizen"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Citizen already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /citizens/{id}:
    get:
      operationId: getCitizen
      tags: [citizens]
      summary: Get citizen by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Citizen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Citizen"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCitizen
      tags: [citizens]
      summary: Update citizen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenUpdate"
      responses:
        "200":
          description: Updated citizen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Citizen"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /citizens/by-phone/{phone}:
    get:
      operationId: getCitizenByPhone
      tags: [citizens]
      summary: Find citizen by phone number
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Citizen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Citizen"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /citizens/focus/start:
    post:
      operationId: startFocusSession
      tags: [citizens]
      summary: Start an authenticated focus timer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionInput"
      responses:
        "201":
          description: Focus session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSessionStarted"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /citizens/focus/{id}/pause:
    post:
      operationId: pauseFocusSession
      tags: [citizens]
      summary: Pause an authenticated focus session
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSessionPaused"
        "409":
          description: Session cannot be paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /citizens/focus/{id}/resume:
    post:
      operationId: resumeFocusSession
      tags: [citizens]
      summary: Resume a paused focus session
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSessionResumed"
        "409":
          description: Session cannot be resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /citizens/focus/{id}/complete:
    post:
      operationId: completeFocusSession
      tags: [citizens]
      summary: Complete a focus session and award Darmins for text volume
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionCompletionInput"
      responses:
        "200":
          description: Session completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSessionResult"
        "409":
          description: Session is not complete or was already submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /citizens/focus/quiz/question:
    get:
      operationId: getFocusQuizQuestion
      tags: [citizens]
      summary: Get a TimeNation quiz question
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Question and one-time attempt identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusQuizQuestion"

  /citizens/focus/quiz/answer:
    post:
      operationId: answerFocusQuizQuestion
      tags: [citizens]
      summary: Submit an answer to a TimeNation quiz question
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusQuizAnswerInput"
      responses:
        "200":
          description: Answer checked and reward progress updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusQuizAnswerResult"
        "409":
          description: Attempt has already been answered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions:
    post:
      operationId: startSession
      tags: [sessions]
      summary: Start a TiMETR session (time transfer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid input or insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Citizen not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/stop:
    post:
      operationId: stopSession
      tags: [sessions]
      summary: Stop a TiMETR session and finalize transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session stopped, transaction logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"
        "400":
          description: Session already stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/transactions:
    get:
      operationId: listAdminTransactions
      tags: [transactions]
      summary: List recent admin transactions or transactions for a passport number
      security:
        - BearerAuth: []
      parameters:
        - name: citizenNumber
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{9}$"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Recent transactions, optionally filtered by citizen passport number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTransaction"
        "400":
          description: Invalid citizen number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/transfer:
    post:
      operationId: makeAdminPersonalTransfer
      tags: [transactions]
      summary: Transfer Darmins from an administrator's personal balance by passport number
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTransferInput"
      responses:
        "200":
          description: Transfer completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTransferResult"
        "400":
          description: Invalid passport number or amount, self-transfer, or insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Citizen passport number not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List all transactions
      parameters:
        - name: citizenId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /citizens/{id}/heritage-transfer:
    post:
      operationId: heritageTransfer
      tags: [citizens]
      summary: Transfer citizenship heritage to heir
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeritageTransferInput"
      responses:
        "200":
          description: Heritage transferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeritageTransferResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Citizen not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /citizens/{id}/wallet-link:
    post:
      operationId: linkWallet
      tags: [citizens]
      summary: Link a Web3 EVM wallet address to citizen passport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenWalletLinkInput"
      responses:
        "200":
          description: Wallet linked, updated citizen returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Citizen"
        "400":
          description: Invalid wallet address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Citizen not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Wallet already linked to another citizen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /timeline/anchor:
    post:
      operationId: anchorTimeline
      tags: [timeline]
      summary: Anchor a timeline minute coordinate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineAnchorInput"
      responses:
        "201":
          description: Anchor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineAnchorResult"
        "400":
          description: Invalid input or insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Citizen not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Coordinate already occupied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /timeline/anchor-move:
    post:
      operationId: moveTimelineAnchor
      tags: [timeline]
      summary: Move an authenticated citizen's anchor to a free coordinate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineAnchorMoveInput"
      responses:
        "200":
          description: Anchor moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineAnchorMoveResult"
        "400":
          description: Invalid or protected coordinate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Source anchor is not owned by the authenticated citizen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Target coordinate is occupied or anchor cannot be moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /timeline/exchanges:
    get:
      operationId: listTimelineExchanges
      tags: [timeline]
      summary: List exchange requests involving the authenticated citizen
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Incoming and outgoing exchange requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineExchangeRequest"
    post:
      operationId: createTimelineExchange
      tags: [timeline]
      summary: Request a negotiated exchange with the owner of an occupied minute
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineExchangeInput"
      responses:
        "201":
          description: Exchange request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineExchangeRequest"
        "400":
          description: Invalid coordinates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Coordinates changed or an exchange is already pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /timeline/exchanges/{id}/respond:
    post:
      operationId: respondToTimelineExchange
      tags: [timeline]
      summary: Accept, reject, or cancel a pending exchange request
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineExchangeResponseInput"
      responses:
        "200":
          description: Exchange request updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineExchangeRequest"
        "403":
          description: Request cannot be managed by this citizen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Request is no longer actionable or anchors changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /timeline/occupied:
    get:
      operationId: getTimelineOccupied
      tags: [timeline]
      summary: Get occupied timeline coordinates
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: string
        - name: month
          in: query
          required: false
          schema:
            type: string
        - name: day
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of occupied coordinates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineOccupiedEntry"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getStats
      tags: [citizens]
      summary: Get global activity stats
      responses:
        "200":
          description: Global activity stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomyStats"

  /stats/visitors:
    post:
      operationId: registerSiteVisitor
      tags: [citizens]
      summary: Count a unique site visitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteVisitorInput"
      responses:
        "204":
          description: Visitor counted or already registered
        "400":
          description: Invalid visitor identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/packages:
    get:
      operationId: getMinutePackages
      tags: [payments]
      summary: List available minute packages for purchase
      responses:
        "200":
          description: Available packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MinutePackage"

  /payments/checkout:
    post:
      operationId: createCheckoutSession
      tags: [payments]
      summary: Create a Stripe checkout session to buy minutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCheckoutInput"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCheckoutResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment gateway not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/webhook:
    post:
      operationId: stripeWebhook
      tags: [payments]
      summary: Stripe webhook — credits minutes on payment completion
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                required:
                  - received

  /tv/slots:
    get:
      operationId: getTvSlots
      tags: [tv]
      summary: Get all 1440 TV slots for a given date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            description: "YYYY-MM-DD"
      responses:
        "200":
          description: Slot list for the date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TvSlotsResponse"
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tv/live-slot:
    get:
      operationId: getTvLiveSlot
      tags: [tv]
      summary: Get broadcast slot for a specific UTC minute (live player engine)
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            description: "YYYY-MM-DD (defaults to today)"
        - name: minute
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 1439
            description: "UTC minute index 0-1439"
      responses:
        "200":
          description: Live slot info for the requested minute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TvLiveSlotResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tv/schedule:
    get:
      operationId: getTvSchedule
      tags: [tv]
      summary: Daily TV schedule summary — booked slots with capsule info
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            description: "YYYY-MM-DD"
      responses:
        "200":
          description: Schedule summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TvScheduleResponse"
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gov/polls:
    get:
      operationId: listActiveGovernmentPolls
      tags: [citizens]
      summary: List active polls available to the authenticated citizen
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Polls open now and available to the citizen's role
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GovernmentPollWithBallots"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Adult KYC verification required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gov/polls/{id}/cast:
    post:
      operationId: castGovernmentPollVote
      tags: [citizens]
      summary: Cast or change a vote on an active poll
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernmentPollVote"
      responses:
        "200":
          description: Vote recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "400":
          description: Invalid vote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Citizen role is not eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Poll is not currently available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/registry/general-votes:
    get:
      operationId: listAdminGovernmentPolls
      tags: [citizens]
      summary: List all general polls for the administrator
      parameters:
        - name: X-Registry-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All scheduled, active, and completed polls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminGovernmentPoll"
        "403":
          description: Registry session is missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminGovernmentPoll
      tags: [citizens]
      summary: Create a scheduled general poll
      parameters:
        - name: X-Registry-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernmentPollInput"
      responses:
        "201":
          description: Poll created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGovernmentPoll"
        "400":
          description: Invalid poll settings or start time less than 24 hours away
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Registry session is missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    TimenamingConfig:
      type: object
      properties:
        network: { type: string }
        chainId: { type: integer }
        royaltyBps: { type: integer }
        royaltyRecipient: { type: string }
        contractConfigured: { type: boolean }
        ipfsPinningConfigured: { type: boolean }
        legalTextStatus: { type: string }
      required: [network, chainId, royaltyBps, royaltyRecipient, contractConfigured, ipfsPinningConfigured, legalTextStatus]

    TimenamingAvailability:
      type: object
      properties:
        timestamp: { type: string }
        available: { type: boolean }
        reserved: { type: boolean }
        ownedByMe: { type: boolean }
        minuteStatus: { type: string }
        license:
          $ref: "#/components/schemas/TimenamingLicense"
      required: [timestamp, available, reserved]

    TimenamingLicense:
      type: object
      additionalProperties: true
      properties:
        id: { type: integer }
        certificateId: { type: string }
        timelineAnchorId: { type: integer }
        timelineCoord: { type: string }
        citizenId: { type: integer }
        ownerName: { type: string }
        customTitle: { type: string }
        customDescription: { type: string }
        walletAddress: { type: string }
        status: { type: string }
        transactionHash: { type: ["string", "null"] }
        tokenId: { type: ["string", "null"] }
        explorerUrl: { type: ["string", "null"] }
        metadataUri: { type: ["string", "null"] }
        certificateIpfsUri: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"], format: date-time }

    TimenamingLicenseList:
      type: object
      properties:
        licenses:
          type: array
          items:
            $ref: "#/components/schemas/TimenamingLicense"
      required: [licenses]

    TimenamingReservationInput:
      type: object
      properties:
        minuteTimestamp: { type: string }
        purchaseType:
          type: string
          enum: [TIMELINE_ONLY, ALL_INCLUSIVE]
        ownerName: { type: string, maxLength: 120 }
        customTitle: { type: string, maxLength: 160 }
        customDescription: { type: string, maxLength: 2000 }
        walletAddress: { type: string, pattern: "^0x[a-fA-F0-9]{40}$" }
      required: [minuteTimestamp]

    TimenamingUpgradeInput:
      type: object
      properties:
        minuteTimestamp: { type: string }
        ownerName: { type: string, minLength: 1, maxLength: 120 }
        customTitle: { type: string, minLength: 1, maxLength: 160 }
        customDescription: { type: string, maxLength: 2000 }
        walletAddress: { type: string, pattern: "^0x[a-fA-F0-9]{40}$" }
      required: [minuteTimestamp, ownerName, customTitle, walletAddress]

    TimenamingMutationResult:
      type: object
      additionalProperties: true
      properties:
        status: { type: string }
        newBalance: { type: number }
        transactionHash: { type: ["string", "null"] }
        tokenId: { type: ["string", "integer", "null"] }
        explorerUrl: { type: ["string", "null"] }
        certificateId: { type: ["string", "null"] }
        license:
          $ref: "#/components/schemas/TimenamingLicense"

    TimenamingCertificateResult:
      type: object
      properties:
        downloadUrl: { type: string }
        certificateId: { type: string }
      required: [downloadUrl, certificateId]

    ServiceCatalogAuditPreviewInput:
      type: object
      properties:
        title:
          type: string
          minLength: 4
          maxLength: 100
        category:
          type: string
          minLength: 2
          maxLength: 60
        description:
          type: string
          minLength: 20
          maxLength: 2000
        requestKey:
          type: string
          minLength: 8
          maxLength: 100
        lang:
          type: string
          maxLength: 10
      required: [title, category, description, requestKey]

    ServiceCatalogPublishInput:
      type: object
      properties:
        requestKey: { type: string, minLength: 8, maxLength: 100 }
        auditToken: { type: string, minLength: 20, maxLength: 5000 }
        priceDarmins: { type: integer, minimum: 1, maximum: 1000 }
      required: [requestKey, auditToken, priceDarmins]

    ServiceCatalogAuditPreview:
      type: object
      properties:
        auditToken: { type: string }
        expiresAt: { type: string, format: date-time }
        audit:
          $ref: "#/components/schemas/ServiceCatalogAudit"
      required: [auditToken, expiresAt, audit]

    ServiceCatalogListing:
      type: object
      properties:
        id: { type: integer }
        citizenId: { type: integer }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        sourceLang: { type: string }
        titleEn: { type: ["string", "null"] }
        categoryEn: { type: ["string", "null"] }
        descriptionEn: { type: ["string", "null"] }
        suggestedPriceDarmins: { type: integer }
        minuteRate: { type: number }
        qualificationSummary: { type: string }
        publicationFeeDarmins: { type: integer }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, citizenId, title, category, description, sourceLang, titleEn, categoryEn, descriptionEn, suggestedPriceDarmins, minuteRate, qualificationSummary, publicationFeeDarmins, status, createdAt, updatedAt]

    ServiceCatalogAudit:
      type: object
      properties:
        suggestedAmount: { type: integer }
        minuteRate: { type: number }
        summary: { type: string }
        qualificationSummary: { type: string }
        documentsAnalyzed: { type: integer }
        englishTranslation:
          type: object
          properties:
            title: { type: string }
            category: { type: string }
            description: { type: string }
          required: [title, category, description]
      required: [suggestedAmount, minuteRate, summary, qualificationSummary, documentsAnalyzed, englishTranslation]

    ServiceCatalogPublishResult:
      type: object
      properties:
        listing:
          $ref: "#/components/schemas/ServiceCatalogListing"
        audit:
          $ref: "#/components/schemas/ServiceCatalogAudit"
        feeDarmins:
          type: integer
      required: [listing, feeDarmins]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
        telegramPolling:
          $ref: "#/components/schemas/TelegramPollingStatus"
      required:
        - status
        - telegramPolling

    TelegramPollingStatus:
      type: object
      properties:
        state:
          type: string
          enum: [disabled, starting, polling, retrying, stopped]
        retryAttempt:
          type: integer
          minimum: 0
        lastFailureAt:
          type: ["string", "null"]
          format: date-time
        nextRetryAt:
          type: ["string", "null"]
          format: date-time
      required:
        - state
        - retryAttempt
        - lastFailureAt
        - nextRetryAt

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    OnboardingStatus:
      type: object
      properties:
        completed:
          type: boolean
        startedAt:
          type: ["string", "null"]
          format: date-time
        durationSeconds:
          type: integer
        secondsRemaining:
          type: integer
        availableAt:
          type: ["string", "null"]
          format: date-time
        secondsUntilEligibility:
          type: integer
        registrationStatus:
          type: ["string", "null"]
        citizenNumber:
          type: ["string", "null"]
        balanceMinutes:
          type: number
        simulatorCurrentQuestionId:
          type: integer
        simulatorRevealedQuestionIds:
          type: array
          items:
            type: integer
        simulatorCompleted:
          type: boolean
      required:
        - completed
        - startedAt
        - durationSeconds
        - secondsRemaining
        - availableAt
        - secondsUntilEligibility
        - registrationStatus
        - citizenNumber
        - balanceMinutes
        - simulatorCurrentQuestionId
        - simulatorRevealedQuestionIds
        - simulatorCompleted

    OnboardingProgress:
      type: object
      properties:
        guideCurrentQuestionId:
          type: integer
        guideRevealedQuestionIds:
          type: array
          items:
            type: integer
        guideCompleted:
          type: boolean
        simulatorCurrentQuestionId:
          type: integer
        simulatorRevealedQuestionIds:
          type: array
          items:
            type: integer
        simulatorCompleted:
          type: boolean
      required:
        - guideCurrentQuestionId
        - guideRevealedQuestionIds
        - guideCompleted
        - simulatorCurrentQuestionId
        - simulatorRevealedQuestionIds
        - simulatorCompleted

    OnboardingProgressSession:
      allOf:
        - $ref: "#/components/schemas/OnboardingProgress"
        - type: object
          properties:
            progressToken:
              type: string
          required: [progressToken]

    OnboardingProgressActionInput:
      type: object
      properties:
        phase:
          type: string
          enum: [guide, simulator]
        action:
          type: string
          enum: [reveal, continue, back]
        questionId:
          type: integer
      required: [phase, action, questionId]

    Citizen:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        citizenNumber:
          type: ["string", "null"]
        telegramId:
          type: ["string", "null"]
        walletAddress:
          type: ["string", "null"]
        balanceMinutes:
          type: integer
        transferableBalance:
          type: integer
        totalGiven:
          type: integer
        totalReceived:
          type: integer
        status:
          type: string
          enum: [active, inactive, suspended]
        meritScore:
          type: number
        rank:
          type: string
        lastActivity:
          type: ["string", "null"]
        createdAt:
          type: string
        onboardingCompleted:
          type: boolean
        ageProfileRequired:
          type: boolean
      required:
        - id
        - name
        - phone
        - citizenNumber
        - telegramId
        - walletAddress
        - balanceMinutes
        - transferableBalance
        - totalGiven
        - totalReceived
        - status
        - meritScore
        - rank
        - lastActivity
        - createdAt
        - ageProfileRequired

    LoginInput:
      type: object
      properties:
        phone:
          type: string
          minLength: 5
        password:
          type: string
      required:
        - phone

    AuthSession:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        balanceMinutes:
          type: number
        totalGiven:
          type: number
        totalReceived:
          type: number
        status:
          type: string
        registrationStatus:
          type: ["string", "null"]
        availableAt:
          type: ["string", "null"]
          format: date-time
        meritScore:
          type: number
        rank:
          type: string
        lastActivity:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        walletAddress:
          type: ["string", "null"]
        walletVerified:
          type: integer
        ageVerified:
          type: integer
        onboardingCompleted:
          type: boolean
        authToken:
          type: string
        ageProfileRequired:
          type: boolean
      required:
        - id
        - name
