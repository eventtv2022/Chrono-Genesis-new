openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TimeNation API — digital state where time is currency
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: citizens
    description: Citizen management
  - name: sessions
    description: TiMETR timer sessions
  - name: transactions
    description: Time transfer transactions
  - name: timeline
    description: Timeline anchor operations
  - name: payments
    description: Fiat gateway — buy minutes
paths:
  /auth/login:
    post:
      operationId: loginCitizen
      tags: [citizens]
      summary: Log in with a phone number and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated citizen profile and bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Login failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/complete-age:
    post:
      operationId: completeCitizenAgeProfile
      tags: [citizens]
      summary: Complete a logged-in citizen's missing age profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteAgeProfileInput"
      responses:
        "200":
          description: Age tier derived and saved; date of birth is not returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteAgeProfileResult"
        "400":
          description: Invalid date of birth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The citizen is under 13
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The age profile has already been completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: registerCitizenWithPassword
      tags: [citizens]
      summary: Register a citizen after completing the pre-application guide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordCitizenRegistrationInput"
      responses:
        "201":
          description: Registered citizen with pending passport eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenRegistrationResult"
        "409":
          description: Phone already registered or guide progress is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/telegram-webapp:
    post:
      operationId: authenticateTelegramWebApp
      tags: [citizens]
      summary: Authenticate or register a Telegram Mini App citizen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramWebAppInput"
      responses:
        "200":
          description: Existing Telegram citizen session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramWebAppSession"
        "201":
          description: Newly registered Telegram citizen session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramWebAppSession"

  /onboarding/status:
    get:
      operationId: getOnboardingStatus
      tags: [citizens]
      summary: Get the authenticated citizen's tutorial status
      responses:
        "200":
          description: Tutorial status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /onboarding/start:
    post:
      operationId: startOnboarding
      tags: [citizens]
      summary: Start the authenticated citizen's 60-minute tutorial
      responses:
        "200":
          description: Tutorial status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [citizens]
      summary: Complete the tutorial after its server-verified duration
      responses:
        "200":
          description: Tutorial status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "409":
          description: Tutorial is not complete yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /onboarding/progress/sessions:
    post:
      operationId: createOnboardingProgressSession
      tags: [citizens]
      summary: Create an anonymous onboarding progress session
      responses:
        "201":
          description: New progress session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgressSession"
  /onboarding/progress/sessions/{progressToken}:
    parameters:
      - name: progressToken
        in: path
        required: true
        schema:
          type: string
          minLength: 64
          maxLength: 64
    get:
      operationId: getOnboardingProgressSession
      tags: [citizens]
      summary: Get anonymous onboarding progress
      responses:
        "200":
          description: Onboarding progress session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgressSession"
        "404":
          description: Progress session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOnboardingProgressSession
      tags: [citizens]
      summary: Reveal or advance a pre-application question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingProgressActionInput"
      responses:
        "200":
          description: Updated onboarding progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgressSession"
        "409":
          description: Question order or stage is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /onboarding/progress:
    get:
      operationId: getCitizenOnboardingProgress
      tags: [citizens]
      summary: Get the authenticated citizen's simulator progress
      responses:
        "200":
          description: Onboarding progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgress"
    patch:
      operationId: updateCitizenOnboardingProgress
      tags: [citizens]
      summary: Reveal or advance a passport simulator question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingProgressActionInput"
      responses:
        "200":
          description: Updated onboarding progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgress"
        "409":
          description: Question order or stage is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /citizens:
    get:
      operationId: listCitizens
      tags: [citizens]
      summary: List all citizens
      responses:
        "200":
          description: List of citizens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Citizen"
    post:
      operationId: createCitizen
      tags: [citizens]
      summary: Register a new citizen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenInput"
      responses:
        "201":
          description: Created citizen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Citizen"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Citizen already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /citizens/{id}:
    get:
      operationId: getCitizen
      tags: [citizens]
      summary: Get citizen by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Citizen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Citizen"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCitizen
      tags: [citizens]
      summary: Update citizen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenUpdate"
      responses:
        "200":
          description: Updated citizen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Citizen"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /citizens/by-phone/{phone}:
    get:
      operationId: getCitizenByPhone
      tags: [citizens]
      summary: Find citizen by phone number
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Citizen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Citizen"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions:
    post:
      operationId: startSession
      tags: [sessions]
      summary: Start a TiMETR session (time transfer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid input or insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Citizen not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/stop:
    post:
      operationId: stopSession
      tags: [sessions]
      summary: Stop a TiMETR session and finalize transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session stopped, transaction logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"
        "400":
          description: Session already stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/transactions:
    get:
      operationId: listAdminTransactions
      tags: [transactions]
      summary: List recent admin transactions or transactions for a passport number
      security:
        - BearerAuth: []
      parameters:
        - name: citizenNumber
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{9}$"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Recent transactions, optionally filtered by citizen passport number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTransaction"
        "400":
          description: Invalid citizen number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List all transactions
      parameters:
        - name: citizenId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /citizens/{id}/heritage-transfer:
    post:
      operationId: heritageTransfer
      tags: [citizens]
      summary: Transfer citizenship heritage to heir
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeritageTransferInput"
      responses:
        "200":
          description: Heritage transferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeritageTransferResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Citizen not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /citizens/{id}/wallet-link:
    post:
      operationId: linkWallet
      tags: [citizens]
      summary: Link a Web3 EVM wallet address to citizen passport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenWalletLinkInput"
      responses:
        "200":
          description: Wallet linked, updated citizen returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Citizen"
        "400":
          description: Invalid wallet address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Citizen not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Wallet already linked to another citizen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /timeline/anchor:
    post:
      operationId: anchorTimeline
      tags: [timeline]
      summary: Anchor a timeline minute coordinate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineAnchorInput"
      responses:
        "201":
          description: Anchor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineAnchorResult"
        "400":
          description: Invalid input or insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Citizen not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Coordinate already occupied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /timeline/occupied:
    get:
      operationId: getTimelineOccupied
      tags: [timeline]
      summary: Get occupied timeline coordinates
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: string
        - name: month
          in: query
          required: false
          schema:
            type: string
        - name: day
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of occupied coordinates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineOccupiedEntry"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getStats
      tags: [citizens]
      summary: Get global activity stats
      responses:
        "200":
          description: Global activity stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomyStats"

  /stats/visitors:
    post:
      operationId: registerSiteVisitor
      tags: [citizens]
      summary: Count a unique site visitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteVisitorInput"
      responses:
        "204":
          description: Visitor counted or already registered
        "400":
          description: Invalid visitor identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/packages:
    get:
      operationId: getMinutePackages
      tags: [payments]
      summary: List available minute packages for purchase
      responses:
        "200":
          description: Available packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MinutePackage"

  /payments/checkout:
    post:
      operationId: createCheckoutSession
      tags: [payments]
      summary: Create a Stripe checkout session to buy minutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCheckoutInput"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCheckoutResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment gateway not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/webhook:
    post:
      operationId: stripeWebhook
      tags: [payments]
      summary: Stripe webhook — credits minutes on payment completion
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                required:
                  - received

  /tv/slots:
    get:
      operationId: getTvSlots
      tags: [tv]
      summary: Get all 1440 TV slots for a given date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            description: "YYYY-MM-DD"
      responses:
        "200":
          description: Slot list for the date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TvSlotsResponse"
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tv/live-slot:
    get:
      operationId: getTvLiveSlot
      tags: [tv]
      summary: Get broadcast slot for a specific UTC minute (live player engine)
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            description: "YYYY-MM-DD (defaults to today)"
        - name: minute
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 1439
            description: "UTC minute index 0-1439"
      responses:
        "200":
          description: Live slot info for the requested minute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TvLiveSlotResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tv/schedule:
    get:
      operationId: getTvSchedule
      tags: [tv]
      summary: Daily TV schedule summary — booked slots with capsule info
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            description: "YYYY-MM-DD"
      responses:
        "200":
          description: Schedule summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TvScheduleResponse"
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gov/polls:
    get:
      operationId: listActiveGovernmentPolls
      tags: [citizens]
      summary: List active polls available to the authenticated citizen
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Polls open now and available to the citizen's role
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GovernmentPollWithBallots"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Adult KYC verification required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gov/polls/{id}/cast:
    post:
      operationId: castGovernmentPollVote
      tags: [citizens]
      summary: Cast or change a vote on an active poll
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernmentPollVote"
      responses:
        "200":
          description: Vote recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "400":
          description: Invalid vote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Citizen role is not eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Poll is not currently available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/registry/general-votes:
    get:
      operationId: listAdminGovernmentPolls
      tags: [citizens]
      summary: List all general polls for the administrator
      parameters:
        - name: X-Registry-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All scheduled, active, and completed polls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminGovernmentPoll"
        "403":
          description: Registry session is missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminGovernmentPoll
      tags: [citizens]
      summary: Create a scheduled general poll
      parameters:
        - name: X-Registry-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernmentPollInput"
      responses:
        "201":
          description: Poll created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGovernmentPoll"
        "400":
          description: Invalid poll settings or start time less than 24 hours away
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Registry session is missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        telegramPolling:
          $ref: "#/components/schemas/TelegramPollingStatus"
      required:
        - status
        - telegramPolling

    TelegramPollingStatus:
      type: object
      properties:
        state:
          type: string
          enum: [disabled, starting, polling, retrying, stopped]
        retryAttempt:
          type: integer
          minimum: 0
        lastFailureAt:
