          type: array
          minItems: 1
          items:
            type: string
            enum: [citizen, labor_officer, gov_admin, system_admin]
        startsAt:
          type: string
          format: date-time
          description: Poll start must be at least 24 hours after creation.
        endsAt:
          type: string
          format: date-time
      required: [title, eligibleRoles, startsAt, endsAt]

